<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講習会を振り返るアンケート｜御薗NBR研究会</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root { --green-dark:#14532d; --green:#16a34a; --green-bg:#eafbf1; --gray:#1f2937; --line:#e3dfd6; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#fff linear-gradient(180deg,#eafbf1 0%,#fff 260px) no-repeat; min-height:100vh; color:var(--gray); padding:16px 16px 120px; }
.container { max-width:560px; margin:0 auto; }
.back { display:inline-block; font-size:15px; font-weight:bold; color:var(--green-dark); text-decoration:none; padding:6px 4px; }
h1 { font-size:21px; line-height:1.5; color:var(--green-dark); margin:6px 0 4px; text-wrap:balance; }
.progress { font-weight:bold; color:var(--green); font-size:14.5px; margin:0 0 12px; }
.card { background:#fff; border-radius:18px; box-shadow:0 4px 14px rgba(22,101,52,.09); padding:16px; margin-bottom:12px; }
.intro p { margin:0 0 10px; font-size:16px; line-height:1.9; } .intro p:last-child { margin:0; }
.intro .em { background:var(--green-bg); border-radius:10px; padding:10px 12px; font-weight:bold; color:var(--green-dark); }
label.f { display:block; font-size:13.5px; color:#6b7280; margin:0 0 4px; font-weight:bold; }
.row { margin-bottom:12px; } .row:last-child { margin-bottom:0; }
input[type=text], select, textarea { width:100%; padding:11px 10px; border:2px solid #bbf7d0; border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--gray); }
textarea { min-height:96px; resize:vertical; line-height:1.7; }
.st h2 { font-size:18px; margin:0 0 6px; color:var(--green-dark); line-height:1.5; }
.st h2 .n { display:inline-block; min-width:30px; height:30px; line-height:30px; text-align:center; background:var(--green); color:#fff; border-radius:999px; font-size:15px; margin-right:8px; }
.st .how { margin:0 0 10px; font-size:15.5px; line-height:1.85; }
.fig { margin:0 0 12px; border:2px solid #bbf7d0; border-radius:12px; overflow:hidden; position:relative; cursor:zoom-in; background:#fff; }
.fig img { display:block; width:100%; height:auto; }
.fig span { position:absolute; right:8px; bottom:8px; background:rgba(20,83,45,.85); color:#fff; font-size:12px; border-radius:999px; padding:3px 10px; }
.figcap { font-size:12.5px; color:#6b7280; margin:-6px 0 12px; line-height:1.6; }
.q { font-weight:bold; font-size:15.5px; line-height:1.7; margin:4px 0 8px; }
.opts { display:grid; gap:8px; margin-bottom:14px; }
.opt { display:flex; gap:10px; text-align:left; width:100%; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; font:inherit; font-size:15px; line-height:1.65; color:var(--gray); }
.opt i { font-style:normal; flex:0 0 24px; height:24px; line-height:24px; text-align:center; border-radius:999px; background:#f3f4f6; font-weight:bold; font-size:13px; margin-top:1px; }
.opt.sel { background:var(--green-bg); border-color:var(--green); font-weight:bold; color:var(--green-dark); }
.opt.sel i { background:var(--green); color:#fff; }
.ta label.f { font-size:14.5px; color:var(--gray); line-height:1.7; margin-bottom:6px; }
#msg { min-height:1.4em; font-size:15px; margin-top:10px; line-height:1.6; }
.bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
.bar .in { max-width:560px; margin:0 auto; padding:12px 16px; }
.bar button, .btn { width:100%; padding:14px; border-radius:12px; border:0; background:var(--green); color:#fff; font:inherit; font-size:17px; font-weight:bold; }
.bar button:disabled { opacity:.55; }
.btn.sub { background:#fff; color:var(--green-dark); border:2px solid #bbf7d0; margin-top:10px; }
.done { text-align:center; line-height:1.9; }
.done h2 { color:var(--green-dark); font-size:20px; margin:0 0 8px; }
.center { text-align:center; padding:30px 10px; line-height:1.9; }
#zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:50; overflow:auto; -webkit-overflow-scrolling:touch; }
#zoom img { display:block; width:200%; max-width:none; margin:60px 0 40px; }
#zoom .x { position:fixed; top:10px; right:12px; background:#fff; color:#111; font-weight:bold; font-size:15px; border:0; border-radius:20px; padding:9px 16px; z-index:51; }

.rowc{border:2px solid #bbf7d0;border-radius:14px;padding:10px 12px;margin:0 0 10px;background:#fcfffd}
.rowc h4{margin:0 0 8px;font-size:15.5px;color:var(--green-dark)}
.add{background:#fff;color:var(--green-dark);border:2px solid #bbf7d0;border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;font-weight:bold;margin:0 8px 6px 0}
.sub2{font-size:16px;color:#0f766e;font-weight:bold;margin:16px 0 6px}
.note{font-size:13px;color:#6b7280;line-height:1.75;background:#f9fafb;border-radius:10px;padding:8px 12px;margin:0 0 10px}
.opt.multi i{border-radius:6px}.opt.multi.sel i{font-size:0}.opt.multi.sel i::after{content:"✓";font-size:14px}
.q small{font-weight:normal;color:#6b7280;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.tags span{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:999px;padding:3px 11px;font-size:14px;color:var(--green-dark)}
.zu{display:grid;gap:12px}.zu .it{border:2px solid #bbf7d0;border-radius:14px;overflow:hidden;background:#fff}
.zu .it img{display:block;width:100%;height:auto;cursor:zoom-in}.zu .cap{padding:8px 12px 4px;font-weight:bold;color:var(--green-dark);font-size:15.5px}
.zu .act{display:flex;gap:8px;padding:6px 12px 12px}.zu .act a,.zu .act button{flex:1;text-align:center;text-decoration:none;font:inherit;font-size:14.5px;font-weight:bold;border-radius:10px;padding:10px 6px;border:2px solid #bbf7d0;background:#fff;color:var(--green-dark)}
.zu .act a.dl{background:var(--green);border-color:var(--green);color:#fff}

.sub2{font-size:16px;color:#0f766e;font-weight:bold;margin:16px 0 6px}
.note{font-size:13px;color:#6b7280;line-height:1.75;background:#f9fafb;border-radius:10px;padding:8px 12px;margin:0 0 10px}
.opt.multi i{border-radius:6px}.opt.multi.sel i{font-size:0}.opt.multi.sel i::after{content:"✓";font-size:14px}
.q small{font-weight:normal;color:#6b7280;font-size:13px}
.rw{margin:0 0 12px}.rw .f{display:block;font-weight:bold;margin:0 0 5px;font-size:15px;color:#14532d;line-height:1.6}
.rw select{width:100%;padding:12px 10px;border:2px solid #bbf7d0;border-radius:10px;font:inherit;font-size:16px;background:#fff}
.rw select.has{border-color:#16a34a;background:#f0fdf4}
.rw .pk{font-size:14px;color:#166534;line-height:1.7;margin:4px 2px 0;font-weight:bold}
</style>
</head>
<body>
<div class="container">
  <a class="back" href="./">← 研究会のページへ戻る</a>
  <div id="app"><div class="center">読み込み中です…</div></div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in"><button type="button" id="sendBtn">送信する</button></div></div>
<script>

  var LIFF_ID = '2012344350-UrAuPXOV';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxkdezeZ6jp7Rox44fJGwke6skkPlQ7E42G9KMdborNcSTQtoxfu8T-QsjUvklixDFI1A/exec';

  var Q1 = ['とてもわかりやすかった。', 'おおむねわかりやすかった。', 'わかるところと、わかりにくいところがあった。', '全体的にわかりにくかった。', '今の時点では、まだ整理できていない。'];
  var Q2R = ['① 浮かす：触れる直前で止める', '② 接触：触れるか触れないかの軽さで触れる', '③ 術者の指の皮膚がわずかに沈む', '④ 相手の皮膚が沈む'];
  var Q2 = ['無理なくできた。', '少し難しかった。', 'とても難しかった。', 'その段階の感覚自体が、よくわからなかった。', '今回は試していない。'];
  var Q3 = ['はっきり違いを感じた。', 'わずかに違いを感じた。', '感じるときと、感じないときがあった。', '今回は違いがわからなかった。', '練習の方法が十分につかめなかった。'];
  var Q4R = ['質（気・水・血、虚・実、寒・熱）', '位置（上・中・下、前後左右）', '深さ・組織（皮膚、膜、筋肉・腱、骨、内臓など）'];
  var Q4 = ['イメージでき、感覚の違いも感じた。', 'イメージできたが、感覚の違いはわからなかった。', 'イメージできるときと、難しいときがあった。', '何をどうイメージすればよいか、わからなかった。', '今回は試していない。'];
  var Q5 = ['とても助けになった。', '少し助けになった。', 'どちらともいえない。', 'あまり助けにならなかった。', '入力に気を取られ、実技に集中しにくかった。'];
  var Q6 = ['感じた場所や範囲を整理できた。', '複数の反応をまとめて見ることができた。', 'あとから見返す手がかりになると思った。', '感じたことを図や言葉にするのが難しかった。', '何を記録すればよいか迷った。', '今の時点では、役立つかどうかわからない。', '今回は記録していない。'];
  var Q6_NONE = 6;
  var Q7 = ['四海と、身体全体のつながり。', '軽い接触の方法。', '止める・保つ・連続して動かす練習。', 'イメージを使った比較。', '感じたことと、解釈したことの区別。', '曖昧な反応や、判断できないときの進め方。', '人体図への記録と、その見返し方。', '脳の働きや痛みの仕組み。', '臨床動画を使った観察・判断の解説。', 'その他。'];

  var idToken = '', info = null, S = null, DKEY = 'nbr_review_draft_v1';
  var app = document.getElementById('app');
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function call(p) {
    p.idToken = idToken;
    return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) }).then(function (r) { return r.json(); });
  }
  function msg(t, ok) { var m = $('msg'); if (m) { m.textContent = t; m.style.color = ok ? '#15803d' : '#c0603d'; } }
  function showError(m) { app.innerHTML = '<div class="card center">' + esc(m) + '<br><br><a class="back" href="./">← 研究会のページへ戻る</a></div>'; $('bar').style.display = 'none'; }
  function today() { try { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' }); } catch (e) { return ''; } }

  function newState() {
    return { name: info.name || '', date: today(), group: info.groups[0] || '（管理者）',
      q1: null, c1: '', q2: [null, null, null, null], c2: '', q3: null, c3: '', q4: [null, null, null], c4: '',
      q5: null, c5: '', q6: [], c6: '', q7: [], c7: '', f8: '' };
  }
  function saveDraft() { try { localStorage.setItem(DKEY, JSON.stringify(S)); } catch (e) {} }
  function loadDraft() { try { return JSON.parse(localStorage.getItem(DKEY) || 'null'); } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DKEY); } catch (e) {} }

  function optBtn(kind, g, k, label, sel) {
    return '<button type="button" class="opt ' + kind + (sel ? ' sel' : '') + '" data-g="' + g + '" data-k="' + k + '"><i>' + (kind === 'multi' ? '' : (k + 1)) + '</i><span>' + esc(label) + '</span></button>';
  }
  function single(g, list, cur) { return '<div class="opts">' + list.map(function (c, k) { return optBtn('single', g, k, c, cur === k); }).join('') + '</div>'; }
  function multi(g, list, arr) { return '<div class="opts">' + list.map(function (c, k) { return optBtn('multi', g, k, c, arr.indexOf(k) >= 0); }).join('') + '</div>'; }
  function ta(id, label, val) { return '<div class="ta row"><label class="f" for="' + id + '">' + label + '<small style="font-weight:normal;color:#6b7280">（自由記述・任意）</small></label><textarea id="' + id + '">' + esc(val) + '</textarea></div>'; }
  function rows(g, labels, list, arr) {
    return labels.map(function (l, i) {
      return '<div class="rw"><label class="f">' + esc(l) + '</label><select data-g="' + g + '" data-i="' + i + '" class="' + (arr[i] !== null ? 'has' : '') + '"><option value="">選んでください</option>' +
        list.map(function (c, k) { return '<option value="' + k + '"' + (arr[i] === k ? ' selected' : '') + '>' + (k + 1) + '. ' + esc(c) + '</option>'; }).join('') + '</select><div class="pk">' + (arr[i] !== null ? esc(list[arr[i]]) : '') + '</div></div>';
    }).join('');
  }
  function qcard(n, title, lead, body) {
    return '<div class="card st"><h2><span class="n">' + n + '</span>' + esc(title) + '</h2>' + (lead ? '<p class="how">' + esc(lead) + '</p>' : '') + body + '</div>';
  }

  function progress() {
    var n = 0, total = 11;
    if (S.q1 !== null) n++; S.q2.forEach(function (v) { if (v !== null) n++; }); if (S.q3 !== null) n++;
    S.q4.forEach(function (v) { if (v !== null) n++; }); if (S.q5 !== null) n++; if (S.q6.length) n++;
    $('progress').textContent = '必須の質問：' + n + ' / ' + total + ' 回答済み';
  }

  function render() {
    var h = '<h1>講習会を振り返るアンケート</h1><div class="progress" id="progress"></div>';
    h += '<div class="card intro"><p>今回の説明や実技について、率直な感想をお聞かせください。</p>' +
      '<p class="em">「難しかった」「わからなかった」「違いを感じなかった」という回答も、今後の講習会を考えるうえで大切な情報です。遠慮なく、今回の実感に近いものを選んでください。</p></div>';
    h += '<div class="card"><div class="row"><label class="f" for="nm">受講者名</label><input type="text" id="nm" maxlength="60" value="' + esc(S.name) + '"></div>' +
      '<div class="row"><label class="f" for="grp">講習会名</label><select id="grp">' +
      (info.groups.length ? info.groups.map(function (g) { return '<option' + (g === S.group ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') : '<option>（管理者）</option>') + '</select></div>' +
      '<div class="row"><label class="f" for="dt">実施日</label><input type="date" id="dt" value="' + esc(S.date) + '" style="width:100%;padding:11px 10px;border:2px solid #bbf7d0;border-radius:10px;font:inherit;font-size:16px"></div></div>';

    h += qcard('1', '今回の講習会の内容は、わかりやすかったですか？', '一つ選んでください。', single('q1', Q1, S.q1) + ta('c1', '特にわかりやすかったこと、わかりにくかったことがあれば教えてください。', S.c1));
    h += qcard('2', '四つの接触の方法は、難しかったですか？', 'それぞれについて、今回の実感に近いものを選んでください。', rows('q2', Q2R, Q2, S.q2) + ta('c2', 'どのようなところが難しかったですか？', S.c2));
    h += qcard('3', '「止めること」と「その状態を保つこと」の違いを感じましたか？', '一つ選んでください。', single('q3', Q3, S.q3) + ta('c3', '止めている間や、最後に力を抜いたときに気づいたことがあれば教えてください。', S.c3));
    h += qcard('4', 'イメージを使って比較することはできましたか？', '次の三つについて、それぞれ選んでください。', rows('q4', Q4R, Q4, S.q4) + ta('c4', 'イメージしやすかったもの、難しかったものがあれば教えてください。', S.c4));
    h += qcard('5', '実技の途中でアンケートに答えることは、自分の感覚を振り返る助けになりましたか？', '一つ選んでください。', single('q5', Q5, S.q5) + ta('c5', '回答するタイミングや、質問の内容について、ご意見があれば教えてください。', S.c5));
    h += qcard('6', '紙の人体図に記録してみて、どう感じましたか？', '当てはまるものをすべて選んでください。', multi('q6', Q6, S.q6) + ta('c6', '記録して気づいたことがあれば教えてください。', S.c6));
    h += qcard('7', '今後、もう一度説明を聞いたり、練習したりしたいことは何ですか？', '当てはまるものをすべて選んでください（なければ、選ばなくて大丈夫です）。', multi('q7', Q7, S.q7) + ta('c7', '具体的な質問や、取り上げてほしい内容があれば教えてください。', S.c7));
    h += qcard('8', '今回の講習会について、率直なご意見をお書きください。', '印象に残ったこと、難しかったこと、説明や実技の進め方への要望など、自由にお書きください。今はまだわからないことや、あとから確かめてみたいことも、そのまま残してください。',
      '<div class="ta row"><label class="f" for="f8">ご意見<small style="font-weight:normal;color:#6b7280">（自由記述・任意）</small></label><textarea id="f8">' + esc(S.f8) + '</textarea></div><div id="msg"></div>');
    app.innerHTML = h;
    $('bar').style.display = 'block';
    progress();
  }

  var bound = false;
  function bind() {
    app.addEventListener('click', function (e) {
      var b = e.target.closest('.opt'); if (!b) return;
      var g = b.dataset.g, k = +b.dataset.k;
      if (g === 'q1' || g === 'q3' || g === 'q5') {
        S[g] = S[g] === k ? null : k;
        b.parentElement.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', S[g] !== null && +o.dataset.k === S[g]); });
      } else if (g === 'q6' || g === 'q7') {
        var a = S[g], i = a.indexOf(k);
        if (i >= 0) a.splice(i, 1);
        else {
          if (g === 'q6') { if (k === Q6_NONE) a.length = 0; else { var j = a.indexOf(Q6_NONE); if (j >= 0) a.splice(j, 1); } }
          a.push(k);
        }
        b.parentElement.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', a.indexOf(+o.dataset.k) >= 0); });
      }
      progress(); saveDraft();
    });
    function onInput(e) {
      var t = e.target, id = t.id;
      if (t.tagName === 'SELECT' && t.dataset.g) { S[t.dataset.g][+t.dataset.i] = t.value === '' ? null : +t.value; t.classList.toggle('has', t.value !== ''); t.nextElementSibling.textContent = t.value === '' ? '' : (t.dataset.g === 'q2' ? Q2 : Q4)[+t.value]; progress(); saveDraft(); return; }
      if (id === 'nm') S.name = t.value; else if (id === 'dt') S.date = t.value; else if (id === 'grp') S.group = t.value;
      else if (/^c[1-7]$/.test(id) || id === 'f8') S[id] = t.value;
      saveDraft();
    }
    app.addEventListener('input', onInput); app.addEventListener('change', onInput);
    $('sendBtn').onclick = send;
  }

  function send() {
    S.name = $('nm').value; S.group = $('grp').value; S.date = $('dt').value;
    if (!S.name.trim()) return msg('受講者名を入力してください');
    if (S.q1 === null) return msg('1．を選んでください');
    for (var i = 0; i < 4; i++) if (S.q2[i] === null) return msg('2．' + Q2R[i].slice(0, 2) + ' を選んでください');
    if (S.q3 === null) return msg('3．を選んでください');
    for (var j = 0; j < 3; j++) if (S.q4[j] === null) return msg('4．' + Q4R[j].split('（')[0] + ' を選んでください');
    if (S.q5 === null) return msg('5．を選んでください');
    if (!S.q6.length) return msg('6．当てはまるものを、一つ以上選んでください');
    var b = $('sendBtn'); b.disabled = true; msg('送信中…', true);
    call({ action: 'reviewSave', name: S.name.trim(), date: S.date, group: S.group,
      q1: S.q1, c1: S.c1.trim(), q2: S.q2, c2: S.c2.trim(), q3: S.q3, c3: S.c3.trim(), q4: S.q4, c4: S.c4.trim(),
      q5: S.q5, c5: S.c5.trim(), q6: S.q6.slice().sort(function (a, c) { return a - c; }), c6: S.c6.trim(),
      q7: S.q7.slice().sort(function (a, c) { return a - c; }), c7: S.c7.trim(), f8: S.f8.trim() })
    .then(function (r) {
      if (!r.ok) throw new Error(r.error || '送信できませんでした');
      clearDraft(); $('bar').style.display = 'none';
      app.innerHTML = '<div class="card done"><h2>送信しました</h2><p>ご協力ありがとうございました。<br>いただいた感想は、今後の講習会づくりに活かします。</p><a class="back" href="./" style="margin-top:10px">← 研究会のページへ戻る</a></div>';
      window.scrollTo(0, 0);
    }).catch(function (e) { msg('送信に失敗しました：' + e.message); b.disabled = false; });
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    // ブラウザ（PC・iPad）で、前回のログイン情報が古くなっているとき（約1時間で期限切れ）は、自動でログインし直す
    if (!liff.isInClient()) {
      try {
        var _d = liff.getDecodedIDToken();
        if (!_d || _d.exp * 1000 < Date.now() + 60000) {
          if (!sessionStorage.getItem('nbr_relogin')) { sessionStorage.setItem('nbr_relogin', '1'); liff.logout(); liff.login({ redirectUri: location.href }); return; }
        } else { sessionStorage.removeItem('nbr_relogin'); }
      } catch (e) {}
    }
    idToken = liff.getIDToken();
    return call({ action: 'touchInfo' }).then(function (r) {
      if (!r.ok) { showError(r.error || '読み込めませんでした。'); return; }
      info = r;
      var d = loadDraft();
      S = (d && Array.isArray(d.q2) && Array.isArray(d.q4) && Array.isArray(d.q6)) ? d : newState();
      if (info.groups.indexOf(S.group) < 0) S.group = info.groups[0] || '（管理者）';
      render(); if (!bound) { bound = true; bind(); }
    });
  }).catch(function () { showError('読み込めませんでした。LINEから開き直してください。'); });
</script>
</body>
</html>
