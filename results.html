<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>振り返りアンケートの回答｜御薗NBR研究会</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root { --green-dark:#14532d; --green:#16a34a; --green-bg:#eafbf1; --gray:#1f2937; --line:#e3dfd6; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#fff linear-gradient(180deg,#eafbf1 0%,#fff 260px) no-repeat; min-height:100vh; color:var(--gray); padding:16px 16px 120px; }
.container { max-width:560px; margin:0 auto; }
.back { display:inline-block; font-size:15px; font-weight:bold; color:var(--green-dark); text-decoration:none; padding:6px 4px; }
h1 { font-size:21px; line-height:1.5; color:var(--green-dark); margin:6px 0 4px; text-wrap:balance; }
.progress { font-weight:bold; color:var(--green); font-size:14.5px; margin:0 0 12px; }
.card { background:#fff; border-radius:18px; box-shadow:0 4px 14px rgba(22,101,52,.09); padding:16px; margin-bottom:12px; }
.intro p { margin:0 0 10px; font-size:16px; line-height:1.9; } .intro p:last-child { margin:0; }
.intro .em { background:var(--green-bg); border-radius:10px; padding:10px 12px; font-weight:bold; color:var(--green-dark); }
label.f { display:block; font-size:13.5px; color:#6b7280; margin:0 0 4px; font-weight:bold; }
.row { margin-bottom:12px; } .row:last-child { margin-bottom:0; }
input[type=text], select, textarea { width:100%; padding:11px 10px; border:2px solid #bbf7d0; border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--gray); }
textarea { min-height:96px; resize:vertical; line-height:1.7; }
.st h2 { font-size:18px; margin:0 0 6px; color:var(--green-dark); line-height:1.5; }
.st h2 .n { display:inline-block; min-width:30px; height:30px; line-height:30px; text-align:center; background:var(--green); color:#fff; border-radius:999px; font-size:15px; margin-right:8px; }
.st .how { margin:0 0 10px; font-size:15.5px; line-height:1.85; }
.fig { margin:0 0 12px; border:2px solid #bbf7d0; border-radius:12px; overflow:hidden; position:relative; cursor:zoom-in; background:#fff; }
.fig img { display:block; width:100%; height:auto; }
.fig span { position:absolute; right:8px; bottom:8px; background:rgba(20,83,45,.85); color:#fff; font-size:12px; border-radius:999px; padding:3px 10px; }
.figcap { font-size:12.5px; color:#6b7280; margin:-6px 0 12px; line-height:1.6; }
.q { font-weight:bold; font-size:15.5px; line-height:1.7; margin:4px 0 8px; }
.opts { display:grid; gap:8px; margin-bottom:14px; }
.opt { display:flex; gap:10px; text-align:left; width:100%; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; font:inherit; font-size:15px; line-height:1.65; color:var(--gray); }
.opt i { font-style:normal; flex:0 0 24px; height:24px; line-height:24px; text-align:center; border-radius:999px; background:#f3f4f6; font-weight:bold; font-size:13px; margin-top:1px; }
.opt.sel { background:var(--green-bg); border-color:var(--green); font-weight:bold; color:var(--green-dark); }
.opt.sel i { background:var(--green); color:#fff; }
.ta label.f { font-size:14.5px; color:var(--gray); line-height:1.7; margin-bottom:6px; }
#msg { min-height:1.4em; font-size:15px; margin-top:10px; line-height:1.6; }
.bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
.bar .in { max-width:560px; margin:0 auto; padding:12px 16px; }
.bar button, .btn { width:100%; padding:14px; border-radius:12px; border:0; background:var(--green); color:#fff; font:inherit; font-size:17px; font-weight:bold; }
.bar button:disabled { opacity:.55; }
.btn.sub { background:#fff; color:var(--green-dark); border:2px solid #bbf7d0; margin-top:10px; }
.done { text-align:center; line-height:1.9; }
.done h2 { color:var(--green-dark); font-size:20px; margin:0 0 8px; }
.center { text-align:center; padding:30px 10px; line-height:1.9; }
#zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:50; overflow:auto; -webkit-overflow-scrolling:touch; }
#zoom img { display:block; width:200%; max-width:none; margin:60px 0 40px; }
#zoom .x { position:fixed; top:10px; right:12px; background:#fff; color:#111; font-weight:bold; font-size:15px; border:0; border-radius:20px; padding:9px 16px; z-index:51; }

.rowc{border:2px solid #bbf7d0;border-radius:14px;padding:10px 12px;margin:0 0 10px;background:#fcfffd}
.rowc h4{margin:0 0 8px;font-size:15.5px;color:var(--green-dark)}
.add{background:#fff;color:var(--green-dark);border:2px solid #bbf7d0;border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;font-weight:bold;margin:0 8px 6px 0}
.sub2{font-size:16px;color:#0f766e;font-weight:bold;margin:16px 0 6px}
.note{font-size:13px;color:#6b7280;line-height:1.75;background:#f9fafb;border-radius:10px;padding:8px 12px;margin:0 0 10px}
.opt.multi i{border-radius:6px}.opt.multi.sel i{font-size:0}.opt.multi.sel i::after{content:"✓";font-size:14px}
.q small{font-weight:normal;color:#6b7280;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.tags span{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:999px;padding:3px 11px;font-size:14px;color:var(--green-dark)}
.zu{display:grid;gap:12px}.zu .it{border:2px solid #bbf7d0;border-radius:14px;overflow:hidden;background:#fff}
.zu .it img{display:block;width:100%;height:auto;cursor:zoom-in}.zu .cap{padding:8px 12px 4px;font-weight:bold;color:var(--green-dark);font-size:15.5px}
.zu .act{display:flex;gap:8px;padding:6px 12px 12px}.zu .act a,.zu .act button{flex:1;text-align:center;text-decoration:none;font:inherit;font-size:14.5px;font-weight:bold;border-radius:10px;padding:10px 6px;border:2px solid #bbf7d0;background:#fff;color:var(--green-dark)}
.zu .act a.dl{background:var(--green);border-color:var(--green);color:#fff}

.tabs{display:flex;gap:8px;margin:8px 0 12px}.tabs button{flex:1;font:inherit;font-weight:bold;font-size:15.5px;padding:11px 6px;border-radius:12px;border:2px solid #bbf7d0;background:#fff;color:#166534}.tabs button.on{background:#16a34a;border-color:#16a34a;color:#fff}
.flt{display:grid;gap:8px;margin:0 0 10px}.flt select,.flt input{width:100%;padding:11px 10px;border:2px solid #bbf7d0;border-radius:10px;font:inherit;font-size:16px;background:#fff}
.cnt{font-size:14px;color:#4b5563;margin:0 0 8px}
details.rsp{background:#fff;border:2px solid #bbf7d0;border-radius:14px;margin:0 0 10px;overflow:hidden}
details.rsp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
details.rsp>summary::-webkit-details-marker{display:none}
details.rsp>summary b{font-size:17px;color:#14532d}details.rsp>summary span{font-size:13px;color:#6b7280}
details.rsp[open]>summary{background:#f0fdf4;border-bottom:1px solid #bbf7d0}
.rsp .in{padding:6px 14px 14px}
.qa{padding:10px 0;border-bottom:1px dashed #d1fae5}.qa:last-child{border-bottom:0}
.qt{font-size:13px;color:#6b7280;font-weight:bold;margin:0 0 4px;line-height:1.6}
.an{display:flex;gap:7px;align-items:flex-start;font-size:15.5px;line-height:1.7;margin:2px 0}
.an i{flex:none;width:12px;height:12px;border-radius:50%;margin-top:7px;background:#9ca3af}
.an i.d0{background:#16a34a}.an i.d1{background:#86efac}.an i.d2{background:#fbbf24}.an i.d3{background:#fb923c}.an i.d4{background:#9ca3af}
.an .lb{color:#14532d;font-weight:bold;min-width:0}
.ct{background:#fffbeb;border-left:4px solid #fbbf24;border-radius:6px;padding:7px 10px;margin:6px 0 0;font-size:15px;line-height:1.8;white-space:pre-wrap}
.sg{margin:0 0 6px}.sg h3{font-size:16px;color:#0f766e;margin:0 0 4px}.sg .sub{font-size:13.5px;color:#14532d;font-weight:bold;margin:8px 0 2px}
.br{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:5px 0;font-size:14.5px;line-height:1.5}
.br .bg{grid-column:1/3;height:9px;background:#ecfdf5;border-radius:6px;overflow:hidden}.br .bg b{display:block;height:100%;background:#4ade80;border-radius:6px}
.br .n{font-weight:bold;color:#166534;white-space:nowrap}
.fc{font-size:14.5px;line-height:1.8;border-bottom:1px dashed #d1fae5;padding:6px 0}.fc:last-child{border:0}.fc b{color:#14532d}
.empty{text-align:center;color:#6b7280;padding:20px}
</style>
</head>
<body>
<div class="container">
  <a class="back" href="./">← 研究会のページへ戻る</a>
  <div id="app"><div class="center">読み込み中です…</div></div>
</div>
<script>

  var LIFF_ID = '2012344350-UrAuPXOV';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxkdezeZ6jp7Rox44fJGwke6skkPlQ7E42G9KMdborNcSTQtoxfu8T-QsjUvklixDFI1A/exec';

  var Q1 = ['とてもわかりやすかった', 'おおむねわかりやすかった', 'わかるところと、わかりにくいところがあった', '全体的にわかりにくかった', '今の時点では、まだ整理できていない'];
  var Q2R = ['① 浮かす：触れる直前で止める', '② 接触：触れるか触れないかの軽さで触れる', '③ 術者の指の皮膚がわずかに沈む', '④ 相手の皮膚が沈む'];
  var Q2 = ['無理なくできた', '少し難しかった', 'とても難しかった', 'その段階の感覚自体が、よくわからなかった', '今回は試していない'];
  var Q3 = ['はっきり違いを感じた', 'わずかに違いを感じた', '感じるときと、感じないときがあった', '今回は違いがわからなかった', '練習の方法が十分につかめなかった'];
  var Q4R = ['質（気・水・血、虚・実、寒・熱）', '位置（上・中・下、前後左右）', '深さ・組織（皮膚、膜、筋肉・腱、骨、内臓など）'];
  var Q4 = ['イメージでき、感覚の違いも感じた', 'イメージできたが、感覚の違いはわからなかった', 'イメージできるときと、難しいときがあった', '何をどうイメージすればよいか、わからなかった', '今回は試していない'];
  var Q5 = ['とても助けになった', '少し助けになった', 'どちらともいえない', 'あまり助けにならなかった', '入力に気を取られ、実技に集中しにくかった'];
  var Q6 = ['感じた場所や範囲を整理できた', '複数の反応をまとめて見ることができた', 'あとから見返す手がかりになると思った', '感じたことを図や言葉にするのが難しかった', '何を記録すればよいか迷った', '今の時点では、役立つかどうかわからない', '今回は記録していない'];
  var Q7 = ['四海と、身体全体のつながり', '軽い接触の方法', '止める・保つ・連続して動かす練習', 'イメージを使った比較', '感じたことと、解釈したことの区別', '曖昧な反応や、判断できないときの進め方', '人体図への記録と、その見返し方', '脳の働きや痛みの仕組み', '臨床動画を使った観察・判断の解説', 'その他'];
  var T = { 1: '1．講習会の内容は、わかりやすかったか', 2: '2．四つの接触の方法は、難しかったか', 3: '3．「止めること」と「保つこと」の違いを感じたか', 4: '4．イメージを使った比較はできたか', 5: '5．実技の途中でアンケートに答えることは、振り返りの助けになったか', 6: '6．紙の人体図に記録してみて、どう感じたか', 7: '7．もう一度、説明を聞いたり練習したりしたいこと', 8: '8．講習会についての率直なご意見' };

  var idToken = '', ALL = [], tab = 'list';
  var app = document.getElementById('app');
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function call(p) {
    p.idToken = idToken;
    return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) }).then(function (r) { return r.json(); });
  }
  function showError(m) { app.innerHTML = '<div class="card center">' + esc(m) + '<br><br><a class="back" href="./">← 研究会のページへ戻る</a></div>'; }
  function strip(s) { return String(s || '').replace(/^\d+\.\s*/, ''); }
  function idx(list, s) { return list.indexOf(strip(s)); }
  function split(s) { return String(s || '').split('／').map(strip).filter(String); }

  function parse(r) {
    return { when: r[0], reg: r[2], name: r[3], group: r[4], date: r[5],
      q1: strip(r[6]), c1: r[7], q2: [r[8], r[9], r[10], r[11]].map(strip), c2: r[12], q3: strip(r[13]), c3: r[14],
      q4: [r[15], r[16], r[17]].map(strip), c4: r[18], q5: strip(r[19]), c5: r[20], q6: split(r[21]), c6: r[22], q7: split(r[23]), c7: r[24], f8: r[25] };
  }

  function filtered() {
    var g = $('fg') ? $('fg').value : '', q = $('fq') ? $('fq').value.trim() : '';
    return ALL.filter(function (x) { return (!g || x.group === g) && (!q || (x.name + ' ' + x.reg).indexOf(q) >= 0); });
  }

  function ans(list, v) {
    var k = list.indexOf(v);
    return '<div class="an"><i class="' + (k >= 0 ? 'd' + k : '') + '"></i><span class="lb">' + esc(v || '（未回答）') + '</span></div>';
  }
  function cm(t) { return t ? '<div class="ct">' + esc(t) + '</div>' : ''; }
  function qa(title, body) { return '<div class="qa"><div class="qt">' + esc(title) + '</div>' + body + '</div>'; }

  function card(x) {
    var h = '<details class="rsp"><summary><b>' + esc(x.name) + (x.reg && x.reg !== x.name ? '（' + esc(x.reg) + '）' : '') + '</b><span>' + esc(x.group) + '　／　実施日 ' + esc(x.date || '—') + '　／　送信 ' + esc(x.when) + '</span></summary><div class="in">';
    h += qa(T[1], ans(Q1, x.q1) + cm(x.c1));
    h += qa(T[2], Q2R.map(function (l, i) { return '<div style="font-size:13px;color:#6b7280;margin-top:4px">' + esc(l) + '</div>' + ans(Q2, x.q2[i]); }).join('') + cm(x.c2));
    h += qa(T[3], ans(Q3, x.q3) + cm(x.c3));
    h += qa(T[4], Q4R.map(function (l, i) { return '<div style="font-size:13px;color:#6b7280;margin-top:4px">' + esc(l) + '</div>' + ans(Q4, x.q4[i]); }).join('') + cm(x.c4));
    h += qa(T[5], ans(Q5, x.q5) + cm(x.c5));
    h += qa(T[6], (x.q6.length ? x.q6.map(function (v) { return '<div class="an"><i class="d0" style="background:#0ea5e9"></i><span class="lb">' + esc(v) + '</span></div>'; }).join('') : '<div class="an"><span>（なし）</span></div>') + cm(x.c6));
    h += qa(T[7], (x.q7.length ? x.q7.map(function (v) { return '<div class="an"><i style="background:#0ea5e9"></i><span class="lb">' + esc(v) + '</span></div>'; }).join('') : '<div class="an"><span>（なし）</span></div>') + cm(x.c7));
    if (x.f8) h += qa(T[8], cm(x.f8));
    return h + '</div></details>';
  }

  function bars(list, counts, n) {
    return list.map(function (l, i) {
      var p = n ? Math.round(counts[i] * 100 / n) : 0;
      return '<div class="br"><span>' + esc(l) + '</span><span class="n">' + counts[i] + '人（' + p + '%）</span><div class="bg"><b style="width:' + p + '%"></b></div></div>';
    }).join('');
  }
  function tally(list, values) { var c = list.map(function () { return 0; }); values.forEach(function (v) { var k = list.indexOf(v); if (k >= 0) c[k]++; }); return c; }

  function summary(rows) {
    var n = rows.length, h = '';
    function one(title, list, vals) { return '<div class="card sg"><h3>' + esc(title) + '</h3>' + bars(list, tally(list, vals), n) + '</div>'; }
    h += one(T[1], Q1, rows.map(function (x) { return x.q1; }));
    h += '<div class="card sg"><h3>' + esc(T[2]) + '</h3>' + Q2R.map(function (l, i) { return '<div class="sub">' + esc(l) + '</div>' + bars(Q2, tally(Q2, rows.map(function (x) { return x.q2[i]; })), n); }).join('') + '</div>';
    h += one(T[3], Q3, rows.map(function (x) { return x.q3; }));
    h += '<div class="card sg"><h3>' + esc(T[4]) + '</h3>' + Q4R.map(function (l, i) { return '<div class="sub">' + esc(l) + '</div>' + bars(Q4, tally(Q4, rows.map(function (x) { return x.q4[i]; })), n); }).join('') + '</div>';
    h += one(T[5], Q5, rows.map(function (x) { return x.q5; }));
    var m6 = []; rows.forEach(function (x) { m6 = m6.concat(x.q6); }); h += one(T[6] + '（複数回答）', Q6, m6);
    var m7 = []; rows.forEach(function (x) { m7 = m7.concat(x.q7); }); h += one(T[7] + '（複数回答）', Q7, m7);
    var fc = [['1', 'c1'], ['2', 'c2'], ['3', 'c3'], ['4', 'c4'], ['5', 'c5'], ['6', 'c6'], ['7', 'c7'], ['8', 'f8']];
    var fh = '';
    fc.forEach(function (p) {
      var items = rows.filter(function (x) { return x[p[1]]; });
      if (items.length) fh += '<div class="sub" style="margin-top:12px">' + esc(T[p[0]]) + '</div>' + items.map(function (x) { return '<div class="fc"><b>' + esc(x.name) + '：</b>' + esc(x[p[1]]) + '</div>'; }).join('');
    });
    h += '<div class="card sg"><h3>自由記述（まとめ）</h3>' + (fh || '<div class="empty">自由記述はまだありません</div>') + '</div>';
    return h;
  }

  function paint() {
    var rows = filtered();
    $('cnt').textContent = rows.length + ' 件の回答' + (rows.length !== ALL.length ? '（全体 ' + ALL.length + ' 件）' : '');
    $('view').innerHTML = !rows.length ? '<div class="empty">該当する回答はありません</div>' : (tab === 'list' ? rows.map(card).join('') : summary(rows));
  }

  function render() {
    var groups = []; ALL.forEach(function (x) { if (x.group && groups.indexOf(x.group) < 0) groups.push(x.group); });
    app.innerHTML = '<h1>振り返りアンケートの回答</h1>' +
      '<div class="tabs"><button type="button" id="t1" class="on">ひとりずつ見る</button><button type="button" id="t2">集計して見る</button></div>' +
      '<div class="flt"><select id="fg"><option value="">すべての講習会</option>' + groups.map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('') + '</select>' +
      '<input type="text" id="fq" placeholder="名前で絞り込む"></div><div class="cnt" id="cnt"></div><div id="view"></div>';
    $('fg').onchange = paint; $('fq').oninput = paint;
    $('t1').onclick = function () { tab = 'list'; $('t1').className = 'on'; $('t2').className = ''; paint(); };
    $('t2').onclick = function () { tab = 'sum'; $('t2').className = 'on'; $('t1').className = ''; paint(); window.scrollTo(0, 0); };
    paint();
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    // ブラウザ（PC・iPad）で、前回のログイン情報が古くなっているとき（約1時間で期限切れ）は、自動でログインし直す
    if (!liff.isInClient()) {
      try {
        var _d = liff.getDecodedIDToken();
        if (!_d || _d.exp * 1000 < Date.now() + 60000) {
          if (!sessionStorage.getItem('nbr_relogin')) { sessionStorage.setItem('nbr_relogin', '1'); liff.logout(); liff.login({ redirectUri: location.href }); return; }
        } else { sessionStorage.removeItem('nbr_relogin'); }
      } catch (e) {}
    }
    idToken = liff.getIDToken();
    return call({ action: 'reviewList' }).then(function (r) {
      if (!r.ok) { showError(r.error || '読み込めませんでした。'); return; }
      ALL = (r.rows || []).map(parse);
      if (!ALL.length) { app.innerHTML = '<h1>振り返りアンケートの回答</h1><div class="card center">まだ回答がありません。</div>'; return; }
      render();
    });
  }).catch(function () { showError('読み込めませんでした。LINEから開き直してください。'); });
</script>
</body>
</html>
