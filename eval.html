<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>評価シート｜御薗NBR研究会</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --green-dark:#14532d; --green:#16a34a; --green-bg:#eafbf1; --gray:#1f2937;
      --c0:#9a978f; --c1:#c0603d; --c2:#c9973a; --c3:#3d7a5f; --line:#e3dfd6; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:#fff linear-gradient(180deg,#eafbf1 0%,#fff 260px) no-repeat; min-height:100vh; color:var(--gray); padding:16px 16px 120px; }
    .container { max-width:560px; margin:0 auto; }
    .back { display:inline-block; font-size:15px; font-weight:bold; color:var(--green-dark); text-decoration:none; padding:6px 4px; }
    header { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin:6px 0 14px; }
    h1 { font-size:21px; line-height:1.4; color:var(--green-dark); margin:0; }
    .progress { font-weight:bold; color:var(--green); }
    .card { background:#fff; border-radius:18px; box-shadow:0 4px 14px rgba(22,101,52,.09); padding:16px; margin-bottom:12px; }
    label.f { display:block; font-size:13.5px; color:#6b7280; margin:0 0 4px; font-weight:bold; }
    .row { margin-bottom:12px; } .row:last-child { margin-bottom:0; }
    input[type=date], select, textarea { width:100%; padding:11px 10px; border:2px solid #bbf7d0; border-radius:10px; font:inherit; font-size:16px; background:#fff; }
    textarea { min-height:90px; resize:vertical; }
    .fixed { padding:11px 10px; border-radius:10px; background:var(--green-bg); font-weight:bold; color:var(--green-dark); }
    .seg { display:flex; gap:8px; }
    .seg button { flex:1; padding:11px 4px; border:2px solid #bbf7d0; border-radius:10px; background:#fff; font:inherit; font-size:15px; color:var(--gray); }
    .seg button.sel { background:var(--green); border-color:var(--green); color:#fff; font-weight:bold; }
    .item h2 { font-size:16.5px; margin:0 0 2px; color:var(--green-dark); }
    .item p { margin:0 0 10px; color:#6b7280; font-size:14px; line-height:1.6; }
    .choices { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .opt { padding:12px 4px; border:2px solid var(--line); border-radius:10px; background:#fff; font:inherit; font-size:15px; color:var(--gray); }
    .opt.sel[data-v="未確認"] { background:var(--c0); border-color:var(--c0); color:#fff; }
    .opt.sel[data-v="要練習"] { background:var(--c1); border-color:var(--c1); color:#fff; }
    .opt.sel[data-v="概ねできる"] { background:var(--c2); border-color:var(--c2); color:#fff; }
    .opt.sel[data-v="安定してできる"] { background:var(--c3); border-color:var(--c3); color:#fff; }
    .note { font-size:14px; color:#4b5563; border-left:4px solid var(--green); padding-left:10px; margin:10px 0 0; line-height:1.7; }
    #msg { min-height:1.4em; font-size:15px; margin-top:10px; line-height:1.6; }
    .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
    .bar .in { max-width:560px; margin:0 auto; padding:12px 16px; }
    .bar button { width:100%; padding:14px; border-radius:12px; border:0; background:var(--green); color:#fff; font:inherit; font-size:17px; font-weight:bold; }
    .bar button:disabled { opacity:.55; }
    .cmp h2 { font-size:17px; color:var(--green-dark); margin:0 0 4px; }
    .cmp .sub { font-size:13.5px; color:#6b7280; margin:0 0 10px; line-height:1.6; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { border-top:1px solid var(--line); padding:9px 4px; text-align:left; vertical-align:top; line-height:1.5; }
    th { font-size:12.5px; color:#6b7280; border-top:0; }
    td.v { font-weight:bold; white-space:nowrap; }
    .v0 { color:var(--c0); } .v1 { color:var(--c1); } .v2 { color:var(--c2); } .v3 { color:var(--c3); }
    tr.diff td.item { background:#fff7ed; }
    .tag { display:inline-block; font-size:11.5px; background:#fed7aa; color:#9a3412; border-radius:999px; padding:1px 8px; margin-left:4px; }
    .center { text-align:center; padding:30px 10px; line-height:1.9; }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="./">← 研究会のページへ戻る</a>
  <div id="app"><div class="center">読み込み中です…</div></div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in"><button type="button" id="sendBtn">送信する</button></div></div>

<script>
  var LIFF_ID = '2012344350-UrAuPXOV';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxkdezeZ6jp7Rox44fJGwke6skkPlQ7E42G9KMdborNcSTQtoxfu8T-QsjUvklixDFI1A/exec';
  var SURVEY = (location.search.match(/[?&]s=([a-z0-9_]+)/) || [0, 'skill'])[1];
  var idToken = '', info = null, answers = [], role = '自己評価', records = [];
  var app = document.getElementById('app');
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function call(p) {
    p.idToken = idToken; p.survey = SURVEY;
    return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) }).then(function (r) { return r.json(); });
  }
  function showError(m) { app.innerHTML = '<div class="card center">' + esc(m) + '<br><br><a class="back" href="./">← 研究会のページへ戻る</a></div>'; $('bar').style.display = 'none'; }
  function msg(t, ok) { var m = $('msg'); m.textContent = t; m.style.color = ok ? '#15803d' : '#c0603d'; }

  function curSubject() {          // いま評価している受講生
    if (role === '自己評価') return { id: null, groups: info.groups, name: info.name };
    var sel = $('subj'); var id = sel ? sel.value : '';
    var m = (info.members || []).filter(function (x) { return x.id === id; })[0];
    return m ? { id: m.id, groups: m.groups, name: m.name } : { id: '', groups: [], name: '' };
  }

  function render() {
    var sv = info.survey, n = sv.items.length;
    answers = new Array(n).fill(null);
    var h = '<header><h1>' + esc(sv.title) + '</h1><div class="progress" id="progress">0 / ' + n + '項目</div></header>';
    h += '<div class="card">';
    if (info.admin) {
      h += '<div class="row"><label class="f">評価者区分</label><div class="seg" id="roleSeg">' +
        '<button type="button" data-v="自己評価"' + (role === '自己評価' ? ' class="sel"' : '') + '>自己評価</button>' +
        '<button type="button" data-v="講師評価"' + (role === '講師評価' ? ' class="sel"' : '') + '>講師評価</button></div></div>';
    }
    if (role === '講師評価') {
      h += '<div class="row"><label class="f" for="subj">受講生</label><select id="subj"><option value="">選んでください</option>' +
        (info.members || []).map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>'; }).join('') + '</select></div>';
    } else {
      h += '<div class="row"><label class="f">受講生名</label><div class="fixed">' + esc(info.name) + '</div></div>';
    }
    h += '<div class="row"><label class="f" for="grp">回</label><select id="grp"></select></div>';
    h += '<div class="row"><label class="f" for="date">評価日</label><input type="date" id="date"></div></div>';
    h += '<div id="items">' + sv.items.map(function (it, i) {
      return '<div class="card item"><h2>' + (i + 1) + '. ' + esc(it[0]) + '</h2><p>' + esc(it[1]) + '</p><div class="choices">' +
        sv.choices.map(function (c) { return '<button type="button" class="opt" data-i="' + i + '" data-v="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
        '</div></div>'; }).join('') + '</div>';
    h += '<div class="card"><label class="f" for="memo">メモ（気づき・次に練習したいこと）</label><textarea id="memo"></textarea>' +
      (sv.note ? '<p class="note">' + esc(sv.note) + '</p>' : '') + '<div id="msg"></div></div>';
    h += '<div id="cmp"></div>';
    app.innerHTML = h;
    $('bar').style.display = 'block';
    $('date').value = new Date().toLocaleDateString('sv-SE');
    fillGroups();
    bind();
    loadCompare();
  }

  function fillGroups() {
    var s = curSubject(), g = $('grp');
    g.innerHTML = s.groups.length ? s.groups.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') : '<option value="">（受講生を選んでください）</option>';
  }

  function bind() {
    $('items').addEventListener('click', function (e) {
      var b = e.target.closest('.opt'); if (!b) return;
      var i = +b.dataset.i;
      answers[i] = answers[i] === b.dataset.v ? null : b.dataset.v;
      b.parentElement.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('sel', x.dataset.v === answers[i]); });
      $('progress').textContent = answers.filter(Boolean).length + ' / ' + answers.length + '項目';
    });
    if ($('roleSeg')) $('roleSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      role = b.dataset.v; render();
    });
    if ($('subj')) $('subj').addEventListener('change', function () { fillGroups(); loadCompare(); });
    $('grp').addEventListener('change', showCompare);
    $('sendBtn').onclick = send;
  }

  function send() {
    var s = curSubject(), grp = $('grp').value;
    if (role === '講師評価' && !s.id) return msg('受講生を選んでください');
    if (!grp) return msg('回を選んでください');
    if (answers.some(function (a) { return !a; }) && !confirm('未選択の項目は「未確認」として送信します。よろしいですか？')) return;
    var b = $('sendBtn'); b.disabled = true; msg('送信中…', true);
    call({ action: 'evalSave', role: role, subjectId: s.id || undefined, group: grp, date: $('date').value,
      answers: answers.map(function (a) { return a || '未確認'; }), memo: $('memo').value.trim() })
    .then(function (r) {
      if (!r.ok) throw new Error(r.error || '送信できませんでした');
      records = r.records; msg('送信しました。ありがとうございました。', true); showCompare();
      var c = $('cmp'); if (c) c.scrollIntoView({ behavior: 'smooth' });
    }).catch(function (e) { msg('送信に失敗しました：' + e.message); })
    .then(function () { b.disabled = false; });
  }

  function loadCompare() {
    var s = curSubject(); records = [];
    if (role === '講師評価' && !s.id) { showCompare(); return; }
    call({ action: 'evalGet', subjectId: s.id || undefined }).then(function (r) { records = r.ok ? r.records : []; showCompare(); });
  }

  function showCompare() {
    var box = $('cmp'); if (!box) return;
    var grp = $('grp').value, sv = info.survey;
    var self = records.filter(function (x) { return x.group === grp && x.role === '自己評価'; })[0];
    var teach = records.filter(function (x) { return x.group === grp && x.role === '講師評価'; })[0];
    if (!self && !teach) { box.innerHTML = ''; return; }
    function cls(v) { var i = sv.choices.indexOf(v); return i < 0 ? '' : 'v' + i; }
    var h = '<div class="card cmp"><h2>自己評価と講師評価の比べ</h2><p class="sub">' +
      (self ? '自己評価 ' + esc(self.date) : '自己評価：まだ') + '　／　' + (teach ? '講師評価 ' + esc(teach.date) : '講師評価：まだ') +
      '<br>ちがいのある項目に印が付きます。「なぜ違うのか」が、次の発見につながります。</p><table><tr><th>項目</th><th>自己</th><th>講師</th></tr>';
    sv.items.forEach(function (it, i) {
      var a = self ? self.answers[i] : '－', b = teach ? teach.answers[i] : '－';
      var diff = self && teach && a !== b;
      h += '<tr' + (diff ? ' class="diff"' : '') + '><td class="item">' + (i + 1) + '. ' + esc(it[0]) + (diff ? '<span class="tag">ちがい</span>' : '') +
        '</td><td class="v ' + cls(a) + '">' + esc(a) + '</td><td class="v ' + cls(b) + '">' + esc(b) + '</td></tr>';
    });
    h += '</table>';
    if (self && self.memo) h += '<p class="note"><b>自己メモ：</b>' + esc(self.memo) + '</p>';
    if (teach && teach.memo) h += '<p class="note"><b>講師メモ：</b>' + esc(teach.memo) + '</p>';
    box.innerHTML = h + '</div>';
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    return call({ action: 'evalInfo' }).then(function (r) {
      if (!r.ok) { showError(r.error || '読み込めませんでした。'); return; }
      info = r; role = (r.admin && !r.member) ? '講師評価' : '自己評価'; render();
    });
  }).catch(function () { showError('読み込めませんでした。LINEから開き直してください。'); });
</script>
</body>
</html>
