<style>
:root { --green-dark:#14532d; --green:#16a34a; --green-bg:#eafbf1; --gray:#1f2937; --line:#e3dfd6; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#fff linear-gradient(180deg,#eafbf1 0%,#fff 260px) no-repeat; min-height:100vh; color:var(--gray); padding:16px 16px 120px; }
.container { max-width:560px; margin:0 auto; }
.back { display:inline-block; font-size:15px; font-weight:bold; color:var(--green-dark); text-decoration:none; padding:6px 4px; }
h1 { font-size:21px; line-height:1.5; color:var(--green-dark); margin:6px 0 4px; text-wrap:balance; }
.progress { font-weight:bold; color:var(--green); font-size:14.5px; margin:0 0 12px; }
.card { background:#fff; border-radius:18px; box-shadow:0 4px 14px rgba(22,101,52,.09); padding:16px; margin-bottom:12px; }
.intro p { margin:0 0 10px; font-size:16px; line-height:1.9; } .intro p:last-child { margin:0; }
.intro .em { background:var(--green-bg); border-radius:10px; padding:10px 12px; font-weight:bold; color:var(--green-dark); }
label.f { display:block; font-size:13.5px; color:#6b7280; margin:0 0 4px; font-weight:bold; }
.row { margin-bottom:12px; } .row:last-child { margin-bottom:0; }
input[type=text], select, textarea { width:100%; padding:11px 10px; border:2px solid #bbf7d0; border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--gray); }
textarea { min-height:96px; resize:vertical; line-height:1.7; }
.st h2 { font-size:18px; margin:0 0 6px; color:var(--green-dark); line-height:1.5; }
.st h2 .n { display:inline-block; min-width:30px; height:30px; line-height:30px; text-align:center; background:var(--green); color:#fff; border-radius:999px; font-size:15px; margin-right:8px; }
.st .how { margin:0 0 10px; font-size:15.5px; line-height:1.85; }
.fig { margin:0 0 12px; border:2px solid #bbf7d0; border-radius:12px; overflow:hidden; position:relative; cursor:zoom-in; background:#fff; }
.fig img { display:block; width:100%; height:auto; }
.fig span { position:absolute; right:8px; bottom:8px; background:rgba(20,83,45,.85); color:#fff; font-size:12px; border-radius:999px; padding:3px 10px; }
.figcap { font-size:12.5px; color:#6b7280; margin:-6px 0 12px; line-height:1.6; }
.q { font-weight:bold; font-size:15.5px; line-height:1.7; margin:4px 0 8px; }
.opts { display:grid; gap:8px; margin-bottom:14px; }
.opt { display:flex; gap:10px; text-align:left; width:100%; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; font:inherit; font-size:15px; line-height:1.65; color:var(--gray); }
.opt i { font-style:normal; flex:0 0 24px; height:24px; line-height:24px; text-align:center; border-radius:999px; background:#f3f4f6; font-weight:bold; font-size:13px; margin-top:1px; }
.opt.sel { background:var(--green-bg); border-color:var(--green); font-weight:bold; color:var(--green-dark); }
.opt.sel i { background:var(--green); color:#fff; }
.ta label.f { font-size:14.5px; color:var(--gray); line-height:1.7; margin-bottom:6px; }
#msg { min-height:1.4em; font-size:15px; margin-top:10px; line-height:1.6; }
.bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
.bar .in { max-width:560px; margin:0 auto; padding:12px 16px; }
.bar button, .btn { width:100%; padding:14px; border-radius:12px; border:0; background:var(--green); color:#fff; font:inherit; font-size:17px; font-weight:bold; }
.bar button:disabled { opacity:.55; }
.btn.sub { background:#fff; color:var(--green-dark); border:2px solid #bbf7d0; margin-top:10px; }
.done { text-align:center; line-height:1.9; }
.done h2 { color:var(--green-dark); font-size:20px; margin:0 0 8px; }
.center { text-align:center; padding:30px 10px; line-height:1.9; }
#zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:50; overflow:auto; -webkit-overflow-scrolling:touch; }
#zoom img { display:block; width:200%; max-width:none; margin:60px 0 40px; }
#zoom .x { position:fixed; top:10px; right:12px; background:#fff; color:#111; font-weight:bold; font-size:15px; border:0; border-radius:20px; padding:9px 16px; z-index:51; }

    });
    h += '<div class="card st"><h2>全体の感想</h2><div class="ta row"><label class="f" for="o1">5つの段階を比較して、初めて気づいたことや、区別しにくかったことを書いてください。</label><textarea id="o1"></textarea></div>' +
      '<div class="ta row"><label class="f" for="o2">最後に接触をやめて力を抜いたとき、何を感じましたか？ それまで気づかなかった力の入り方に気づいた場合は、そのことも書いてください。</label><textarea id="o2"></textarea></div><div id="msg"></div></div>';
    app.innerHTML = h;
    $('bar').style.display = 'block';
    $('o1').value = (d && d.o1) || ''; $('o2').value = (d && d.o2) || '';
    cmt.forEach(function (c, i) { $('c' + i).value = c; });
    ans.forEach(function (a, i) { paint(i); });
    progress(); bind();
  }
  function paint(i) {
    var box = document.querySelector('.opts[data-i="' + i + '"]'); if (!box) return;
    box.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('sel', +b.dataset.k === ans[i]); });
  }
  function progress() { $('progress').textContent = ans.filter(function (a) { return a !== null; }).length + ' / 5段階 選択済み'; }

  var bound = false;
  function bind() {
    if (bound) return; bound = true;
    app.addEventListener('click', function (e) {
      var b = e.target.closest('.opt');
      if (b) { var i = +b.parentElement.dataset.i, k = +b.dataset.k; ans[i] = ans[i] === k ? null : k; paint(i); progress(); saveDraft(); return; }
      var f = e.target.closest('[data-z]');
      if (f) { var z = $('zoom'); z.querySelector('img').src = f.querySelector('img').src; z.style.display = 'block'; z.scrollTop = 0; z.scrollLeft = 0; document.body.style.overflow = 'hidden'; }
    });
    app.addEventListener('input', function (e) {
      if (e.target.dataset && e.target.dataset.i !== undefined && e.target.tagName === 'TEXTAREA') cmt[+e.target.dataset.i] = e.target.value;
      saveDraft();
    });
    $('zoom').onclick = function (e) { if (e.target.tagName !== 'IMG') { this.style.display = 'none'; document.body.style.overflow = ''; } };
    $('sendBtn').onclick = send;
  }

  function send() {
    var nm = $('nm').value.trim();
    if (!nm) return msg('受講者名・番号を入力してください');
    var miss = [];
    ans.forEach(function (a, i) { if (a === null) miss.push(NUM[i]); });
    if (miss.length) return msg(miss.join('・') + ' の段階が、まだ選ばれていません');
    var b = $('sendBtn'); b.disabled = true; msg('送信中…', true);
    call({ action: 'touchSave', name: nm, group: $('grp').value, times: $('tm').value.trim(),
      choices: ans, comments: cmt.map(function (c) { return c.trim(); }), overall1: $('o1').value.trim(), overall2: $('o2').value.trim() })
    .then(function (r) {
      if (!r.ok) throw new Error(r.error || '送信できませんでした');
      clearDraft(); $('bar').style.display = 'none';
      app.innerHTML = '<div class="card done"><h2>送信しました</h2><p>ありがとうございました。<br>止めたことと、維持している間の感覚を、そのまま見つめられたことが大切です。</p>' +
        '<button type="button" class="btn" id="again">もう一度入力する（次の回数）</button><a class="back" href="./" style="margin-top:10px">← 研究会のページへ戻る</a></div>';
      $('again').onclick = function () { render(true); window.scrollTo(0, 0); };
      window.scrollTo(0, 0);
    }).catch(function (e) { msg('送信に失敗しました：' + e.message); b.disabled = false; });
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    return call({ action: 'touchInfo' }).then(function (r) {
      if (!r.ok) { showError(r.error || '読み込めませんでした。'); return; }
      info = r; render(false);
    });
  }).catch(function () { showError('読み込めませんでした。LINEから開き直してください。'); });
</script>
</body>
</html>
